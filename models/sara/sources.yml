version: 2

sources:
  - name: dev
    description: 'this is the db using to move from src'
    database: japan
    schema: dev
    tables:
      - name: bank_audit
        identifier: audit_bank_transactions

      - name: dummy
        identifier: src_bank_transactions
        description: 'this is the table used to store the table transaction'
        config:
          loaded_at_field: created_ts
          freshness: 
            warn_after: { count: 12 , period: hour}
            error_after: { count: 24 , period: hour }
        
      - name: account_master_src
        columns: 
          - name: ACCOUNT_ID
            tests:
              - unique
              - not_null
          - name: ACCOUNT_STATUS
            tests:
              - not_null
              - accepted_values:
                 arguments: 
                  values: ['ACTIVE','INACTIVE','BLOCKED']
          - name: branch_code
            tests:
              - not_null     

      - name: SRC_PRODUCT  
          